name: Atualizar resultados

# DESLIGADA a 22/10/2026, a pedido: os resultados vao para o site quando se
# carrega em "Publicar no site" no painel. Ja nao corre sozinha.
# So corre se alguem carregar em "Run workflow" no separador Actions.
#
# Para voltar a ligar a atualizacao automatica, junta por baixo de "on:":
#   schedule:
#     - cron: '*/20 * * * *'
#   push:
#     paths:
#       - 'jornadas.json'
on:
  workflow_dispatch:        # botao "Run workflow", so a mao

permissions:
  contents: write

concurrency:
  group: resultados
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (com retry)
        uses: Wandalen/wretry.action@v3
        with:
          action: actions/checkout@v4
          attempt_limit: 3
          attempt_delay: 10000

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ir buscar os resultados
        env:
          TOKEN_FUTEBOL: ${{ secrets.TOKEN_FUTEBOL }}
        run: node atualizar.mjs

      - name: Guardar se houver novidade
        run: |
          if [ -z "$(git status --porcelain dados.json)" ]; then
            echo "Nada mudou."
            exit 0
          fi
          git config user.name "atualizacao automatica"
          git config user.email "actions@github.com"
          git add dados.json
          git commit -m "resultados: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
